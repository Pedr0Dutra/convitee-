<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convite</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#1a1416;
    --wine:oklch(0.38 0.09 15);
    --cream:#f4eee6;
    --ink:#2a2224;
    --muted:#8a7d78;
    --gold:oklch(0.72 0.08 70);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 50% 30%, #2a1f22 0%, var(--night) 70%);
    display:grid;place-items:center;min-height:100vh;padding:32px 16px;
    font-family:'Jost',sans-serif;color:var(--ink);
  }
  .card{
    width:min(440px,100%);
    background:var(--cream);
    padding:56px 44px 44px;
    position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.5);
    text-align:center;
    animation:rise 1.2s cubic-bezier(.2,.7,.2,1) both;
  }
  .card::before{
    content:"";position:absolute;inset:12px;border:1px solid color-mix(in oklch,var(--gold) 60%,transparent);pointer-events:none;
  }
  @keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:300}
  .to{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;margin-top:28px;color:var(--wine)}
  h1{
    font-family:'Cormorant Garamond',serif;font-weight:400;
    font-size:44px;line-height:1.08;margin:18px 0 0;text-wrap:balance;
  }
  h1 em{color:var(--wine)}
  .moon{width:10px;height:10px;border-radius:50%;background:var(--gold);margin:34px auto;box-shadow:0 0 0 6px color-mix(in oklch,var(--gold) 18%,transparent)}
  .timeline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;margin:0 auto;max-width:300px}
  .step{font-family:'Cormorant Garamond',serif;font-size:20px}
  .step small{display:block;font-family:'Jost';font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;font-weight:300}
  .dash{width:28px;height:1px;background:var(--gold)}
  .details{margin-top:34px;font-size:14px;line-height:1.9;color:var(--ink);font-weight:300;letter-spacing:.02em}
  .details strong{font-weight:400}
  .note{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--muted);margin-top:22px}
  [contenteditable]{outline:none;border-radius:2px;transition:background .2s}
  [contenteditable]:hover{background:color-mix(in oklch,var(--gold) 14%,transparent)}
  [contenteditable]:focus{background:color-mix(in oklch,var(--gold) 22%,transparent)}
  .actions{margin-top:34px;display:flex;gap:10px;justify-content:center}
  button{
    font:400 12px 'Jost';letter-spacing:.24em;text-transform:uppercase;
    padding:14px 26px;min-height:44px;cursor:pointer;border:1px solid var(--wine);
    background:var(--wine);color:var(--cream);transition:all .3s;
  }
  button:hover{background:#4d1f26}
  button.ghost{background:transparent;color:var(--wine)}
  button.ghost:hover{background:color-mix(in oklch,var(--wine) 8%,transparent)}
  .reply{display:none;font-family:'Cormorant Garamond',serif;font-size:28px;font-style:italic;color:var(--wine);margin-top:34px;animation:rise .8s both}
  .accepted .actions{display:none}
  .accepted .reply{display:block}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:11px;color:#6b5d5f;letter-spacing:.1em}
  @media print{.hint{display:none} body{background:#fff}}
</style>
</head>
<body>
  <main class="card" id="card">
    <div class="eyebrow">Um convite</div>
    <div class="to" contenteditable spellcheck="false">Para você,</div>
    <h1>Um jantar a dois.<br><em>E depois, a noite.</em></h1>

    <div class="moon"></div>

    <div class="timeline">
      <div class="step"><small contenteditable>20h</small>Jantar</div>
      <div class="dash"></div>
      <div class="step"><small>depois</small><span contenteditable spellcheck="false">Fica comigo</span></div>
    </div>

    <div class="details">
      <div><strong contenteditable spellcheck="false">Sábado, 7 de novembro</strong></div>
      <div contenteditable spellcheck="false">Na minha casa</div>
    </div>

    <p class="note" contenteditable spellcheck="false">Traga só você — o resto é por minha conta.</p>

    <div class="actions">
      <button id="yes">Aceito</button>
      <button class="ghost" id="maybe">Outro dia?</button>
    </div>
    <div class="reply" id="reply">Te espero.</div>
  </main>

  <div class="hint">Clique em qualquer texto para editar</div>

<script>
  const card = document.getElementById('card');
  const reply = document.getElementById('reply');
  document.getElementById('yes').onclick = () => {
    card.style.transition = 'opacity .6s, transform .6s';
    card.style.opacity = 0; card.style.transform = 'translateY(-12px)';
    setTimeout(() => location.href = 'Aceito.html', 600);
  };
  document.getElementById('maybe').onclick = () => { reply.textContent = 'Me diz quando. Eu cozinho.'; card.classList.add('accepted'); };
  reply.onclick = () => card.classList.remove('accepted');

  // salva edições
  const eds = [...document.querySelectorAll('[contenteditable]')];
  eds.forEach((el,i)=>{
    const k='convite-'+i, v=localStorage.getItem(k);
    if(v!==null) el.textContent=v;
    el.addEventListener('input',()=>localStorage.setItem(k,el.textContent));
  });
</script>
</body>
</html>
